# Manual only, not tag-triggered like the other four repos: KERNEL_IMAGE + EXTENSIONS is a
# deliberate, curated combination of published tags (see README "Usage" and the Makefile's own
# comment on why neither has a default) - there is no single upstream event that should trigger a
# rebuild automatically. Run from the Actions tab (or `gh workflow run release.yml -f ...`) with
# the exact refs you want bundled.
#
# `make release` itself loops over both ARCHS (amd64, arm64) and then runs push-manifest - one
# job covers everything, unlike router/nftables/awg-extension's per-arch matrix, because the
# Makefile's own release target already does that looping. Building the arm64 base installer and
# kernel/initramfs export on an amd64 runner needs QEMU (docker buildx --platform=linux/arm64
# during `export-to-oci`/`local-kernel`/`local-initramfs`).
name: Release installer image

on:
  workflow_dispatch:
    inputs:
      kernel_image:
        description: "Kernel image ref (../talos-kernel's published tag, e.g. ghcr.io/slipmesh/kernel:v0.1.0-talos1.13.8)"
        required: true
        type: string
      extensions:
        description: "Space-separated extension image refs, arch-less (no -amd64/-arm64 suffix - Makefile appends it), e.g. ghcr.io/slipmesh/talos-router-extension:v0.1.0-bird2.18"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          docker-images: false

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push installer (both arches + multi-arch manifest)
        run: |
          make release \
            KERNEL_IMAGE="${{ inputs.kernel_image }}" \
            EXTENSIONS="${{ inputs.extensions }}"
