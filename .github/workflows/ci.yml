# Pull requests and pushes check the pins and run tests/; only a merged release PR is built, in its
# own run, and released. That build makes the extensions, the installer and its variants for both
# arches, each on a runner of its own arch, against a registry local to the job, which the imager
# pulls from, then copies them to ghcr.io as `sha-<commit>` for the release to retag, along with an
# imager carrying both arches' kernels. nftables-pkg is an input to the nftables extension only and
# is never published.
name: CI

on:
  push:
    branches: [main, "release-*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pins:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: make check-pins

  tests:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: tests/imager.sh
      - run: tests/talos-tag.sh

  # Builds the amdgpu extension, as a release does, and compares its modules with the kernel's.
  amdgpu:
    runs-on: ubuntu-26.04
    services:
      registry:
        image: registry:3
        ports: ["5000:5000"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."localhost:5000"]
              http = true
              insecure = true
      - run: tests/amdgpu.sh
        env:
          TEST_REGISTRY: localhost:5000

  release-commit:
    if: github.event_name == 'push'
    uses: slipmesh/.github/.github/workflows/release-commit.yml@v2.4

  build:
    needs: [pins, release-commit]
    if: needs.release-commit.outputs.version != ''
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    services:
      registry:
        image: registry:3
        ports: ["5000:5000"]
    steps:
      - uses: actions/checkout@v7

      # The talos checkout, the kernel build context and the bldr stages need more room than a
      # runner has free.
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL

      # Host networking lets the builder reach the job's registry on localhost.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."localhost:5000"]
              http = true
              insecure = true

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the extensions and the installer
        env:
          VERSION: ${{ needs.release-commit.outputs.version }}
        run: |
          make extensions installer push installer-variants TARGET_ARCH=${{ matrix.arch }} \
            TAG=sha-${{ github.sha }} REGISTRY=localhost:5000 VERSION="$VERSION"

      - name: Publish them
        run: |
          make publish TARGET_ARCH=${{ matrix.arch }} TAG=sha-${{ github.sha }} \
            REGISTRY=localhost:5000 PUBLISH_REGISTRY=ghcr.io/slipmesh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kernel-${{ matrix.arch }}
          path: build/out-${{ matrix.arch }}/custom-kernel/
          if-no-files-found: error

  manifest:
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Combine both arches into the installer nodes pull
        run: make manifest TAG=sha-${{ github.sha }} REGISTRY=ghcr.io/slipmesh

  # The stock imager with both arches' kernels, for the disk images a first install writes.
  imager:
    needs: [release-commit, build]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: kernel-*
          merge-multiple: true
          path: build/kernels

      - name: Publish the imager
        env:
          VERSION: ${{ needs.release-commit.outputs.version }}
        run: make imager TAG=sha-${{ github.sha }} REGISTRY=ghcr.io/slipmesh VERSION="$VERSION"

  promote:
    needs: [release-commit, manifest]
    uses: slipmesh/.github/.github/workflows/promote.yml@v2.4
    permissions:
      contents: read
      packages: write
    with:
      tag: ${{ needs.release-commit.outputs.version }}

  promote-imager:
    needs: [release-commit, imager]
    uses: slipmesh/.github/.github/workflows/promote.yml@v2.4
    permissions:
      contents: read
      packages: write
    with:
      image: ghcr.io/slipmesh/imager
      tag: ${{ needs.release-commit.outputs.version }}

  promote-amdgpu:
    needs: [release-commit, manifest]
    uses: slipmesh/.github/.github/workflows/promote.yml@v2.4
    permissions:
      contents: read
      packages: write
    with:
      image: ghcr.io/slipmesh/talos-installer-amdgpu
      tag: ${{ needs.release-commit.outputs.version }}

  tag:
    needs: [release-commit, promote, promote-imager, promote-amdgpu]
    uses: slipmesh/.github/.github/workflows/tag-release.yml@v2.4
    permissions:
      contents: write
    with:
      version: ${{ needs.release-commit.outputs.version }}

  release:
    needs: [release-commit, tag]
    uses: slipmesh/.github/.github/workflows/release.yml@v2.4
    permissions:
      contents: write
    with:
      tag: ${{ needs.release-commit.outputs.version }}
      latest: ${{ needs.release-commit.outputs.latest == 'true' }}
      prerelease: ${{ needs.release-commit.outputs.prerelease == 'true' }}
