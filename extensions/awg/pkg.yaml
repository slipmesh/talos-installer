# The `awg` extension service, which brings up the AmneziaWG interfaces the amneziawg module
# provides. Its binary and its extension-service spec both come from the pinned daemons image, so
# they are always from the same talos-extensions commit.
name: awg
variant: scratch
shell: /bin/bash
dependencies:
  - stage: base
  - image: "{{ .BUILD_ARG_DAEMONS }}"
steps:
  - install:
      - |
        mkdir -p /rootfs/usr/local/lib/containers/awg /rootfs/usr/local/etc/containers
        install -m 0755 /usr/local/bin/awg /rootfs/usr/local/lib/containers/awg/awg
        cp /usr/local/etc/containers/awg.yaml /rootfs/usr/local/etc/containers/awg.yaml
        mkdir -p /rootfs/usr/local/share/licenses/awg
        cp -r /usr/share/licenses/talos-extensions /rootfs/usr/local/share/licenses/awg/
    test:
      - |
        # The daemon links crates, the Rust standard library and musl statically, and their
        # licenses hold only if the notices reach the node with it.
        for notice in THIRD-PARTY-NOTICES COPYRIGHT-rust-std.html COPYRIGHT-musl; do
          file=/rootfs/usr/local/share/licenses/awg/talos-extensions/$notice
          test -s "$file" || { echo "missing $file"; exit 1; }
        done
      - |
        mkdir -p /extensions-validator-rootfs
        cp -r /rootfs/ /extensions-validator-rootfs/rootfs
        cp /pkg/manifest.yaml /extensions-validator-rootfs/manifest.yaml
        /extensions-validator validate --rootfs=/extensions-validator-rootfs --pkg-name="${PKG_NAME}"
finalize:
  - from: /rootfs
    to: /rootfs
  - from: /pkg/manifest.yaml
    to: /
