# The `nftables` extension service: a one-shot ruleset loader and the static `nft` it drives.
# `nft` comes from nftables-pkg (pkgs/nftables-pkg), built in a siderolabs/pkgs checkout; the
# daemon and its extension-service spec come from the pinned daemons image.
#
# `name:` must equal manifest.yaml.tmpl's metadata.name: extensions-validator fails the build on
# "pkg name does not match extension name" otherwise.
name: nftables
variant: scratch
shell: /bin/bash
dependencies:
  - stage: base
  - image: "{{ .BUILD_ARG_NFTABLES_PKG }}"
  - image: "{{ .BUILD_ARG_DAEMONS }}"
steps:
  - install:
      - |
        mkdir -p /rootfs/usr/local/lib/containers/nftables /rootfs/usr/local/etc/containers
        cp /usr/bin/nft /rootfs/usr/local/lib/containers/nftables/nft
        mkdir -p /rootfs/usr/local/share/licenses
        cp -r /usr/local/share/licenses/nftables /rootfs/usr/local/share/licenses/
        install -m 0755 /usr/local/bin/nftables /rootfs/usr/local/lib/containers/nftables/nftables
        cp /usr/local/etc/containers/nftables.yaml /rootfs/usr/local/etc/containers/nftables.yaml
    test:
      - |
        for component in nftables libnftnl libmnl musl; do
          for kind in LICENSE SOURCE; do
            file=/rootfs/usr/local/share/licenses/nftables/$component.$kind
            test -s "$file" || { echo "missing $file"; exit 1; }
          done
        done
      - |
        mkdir -p /extensions-validator-rootfs
        cp -r /rootfs/ /extensions-validator-rootfs/rootfs
        cp /pkg/manifest.yaml /extensions-validator-rootfs/manifest.yaml
        /extensions-validator validate --rootfs=/extensions-validator-rootfs --pkg-name="${PKG_NAME}"
finalize:
  - from: /rootfs
    to: /rootfs
  - from: /pkg/manifest.yaml
    to: /
