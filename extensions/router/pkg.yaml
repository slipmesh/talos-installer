# The `router` extension service, pure userspace: the `router` daemon supervising a bundled
# `bird`. The daemon and its extension-service spec come from the pinned daemons image, so they
# are always from the same talos-extensions commit.
#
# `bird` and `bird_exporter` come from the router-bird and router-bird-exporter stages beside
# this one, which build and test them. `router` spawns `bird_exporter` as `./bird_exporter`, so it
# has to sit in the same directory. Their license texts come along: this image is what reaches a
# node, and a notice left in a build stage is not conveyed.
name: router
variant: scratch
shell: /bin/bash
dependencies:
  - stage: base
  - stage: router-bird
  - stage: router-bird-exporter
  - image: "{{ .BUILD_ARG_DAEMONS }}"
steps:
  - install:
      - |
        mkdir -p /rootfs/usr/local/lib/containers/router
        cp /bird /bird_exporter /rootfs/usr/local/lib/containers/router/
        mkdir -p /rootfs/usr/local/share/licenses/router
        cp /licenses/* /rootfs/usr/local/share/licenses/router/

        install -m 0755 /usr/local/bin/router /rootfs/usr/local/lib/containers/router/router
        mkdir -p /rootfs/usr/local/etc/containers
        cp /usr/local/etc/containers/router.yaml /rootfs/usr/local/etc/containers/router.yaml
    test:
      - |
        mkdir -p /extensions-validator-rootfs
        cp -r /rootfs/ /extensions-validator-rootfs/rootfs
        cp /pkg/manifest.yaml /extensions-validator-rootfs/manifest.yaml
        /extensions-validator validate --rootfs=/extensions-validator-rootfs --pkg-name="${PKG_NAME}"
finalize:
  - from: /rootfs
    to: /rootfs
  - from: /pkg/manifest.yaml
    to: /
